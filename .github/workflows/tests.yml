name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # 1.99.x are the hledger 2.0 pre-releases; move to 2.0 once it ships.
        # 1.52.4 covers 1.x (the README supports 1.52 or higher)
        hledger: ["1.99.5", "1.52.4"]
    name: test (py${{ matrix.python }}, hledger ${{ matrix.hledger }})
    steps:
      - uses: actions/checkout@v7

      - name: Install hledger ${{ matrix.hledger }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/hledger"
          gh release download "${{ matrix.hledger }}" \
            --repo simonmichael/hledger \
            --pattern hledger-linux-x64.tar.gz \
            --output - | tar xz -C "$RUNNER_TEMP/hledger" hledger
          echo "$RUNNER_TEMP/hledger" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/hledger/hledger" --version

      - uses: astral-sh/setup-uv@v7

      - name: Run tests
        env:
          UV_PYTHON_PREFERENCE: managed
        run: uv run --python ${{ matrix.python }} pytest

  # The single check that branch rules require for the test matrix, so that
  # renaming or adding matrix jobs does not leave the rules waiting on old names.
  tests-passed:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check every test job passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix result: ${{ needs.test.result }}" >&2
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Ruff
        run: |
          uvx ruff@0.11.4 check src tests
          uvx ruff@0.11.4 format --check src tests

      - name: ty
        run: |
          uv sync
          uvx ty@0.0.89 check --python .venv/bin/python src tests
